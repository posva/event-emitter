name: Publish to npm

on:
  push:
    tags:
      - '**'

jobs:
  release:
    runs-on: ubuntu-latest
    if: |
      startsWith(github.ref_name, 'v') &&
      github.repository == 'posva/event-emitter'

    environment: release

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve tag info
        id: resolve
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "TAG=$TAG" >>$GITHUB_OUTPUT

          set +e
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 --match "v*" "${TAG}^" 2>/dev/null)
          STATUS=$?
          set -e

          if [[ $STATUS -ne 0 ]]; then
            PREVIOUS_TAG=$(git rev-list --max-parents=0 HEAD)
          fi

          echo "PREVIOUS_TAG=$PREVIOUS_TAG" >>$GITHUB_OUTPUT

          VERSION="${TAG#v}"
          if [[ "$VERSION" =~ -beta ]]; then
            NPM_TAG="beta"
          elif [[ "$VERSION" =~ -alpha ]]; then
            NPM_TAG="alpha"
          elif [[ "$VERSION" =~ -rc ]]; then
            NPM_TAG="rc"
          else
            NPM_TAG="latest"
          fi

          echo "NPM_TAG=$NPM_TAG" >>$GITHUB_OUTPUT

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '>=24.20.0'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Publish to npm
        run: pnpm publish --access public --no-git-checks --tag ${{ steps.resolve.outputs.NPM_TAG }}

      - name: Generate GitHub changelog
        run: pnpx changelogithub@14.0.0 --from "$FROM_TAG" --to "$TAG"
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve.outputs.TAG }}
          FROM_TAG: ${{ steps.resolve.outputs.PREVIOUS_TAG }}
